[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/ui",
    "crates/core",
    "crates/engine",
    "crates/worker",
    "crates/persistence",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["video-merger contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "process", "io-util", "fs", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utility
uuid = { version = "1.10", features = ["v4", "serde"] }
directories = "5.0"
once_cell = "1.20"

# Media decoding (libav bindings)
ffmpeg-next = "7.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Audio
cpal = "0.15"
ringbuf = "0.4"

# Performance
num_cpus = "1.16"

# UI
slint = { version = "1.8", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
slint-build = "1.8"

# Workspace-internal
video-merger-core = { path = "crates/core" }
video-merger-engine = { path = "crates/engine" }
video-merger-worker = { path = "crates/worker" }
video-merger-persistence = { path = "crates/persistence" }
video-merger-ui = { path = "crates/ui" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
